name: CI

on: push

jobs:
  allt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true

      - run: uv sync --locked

      - run: uv run --locked python -m churn.model

      - run: uv run --locked python -m churn.evaluate 

      - run: uv run --locked python -m churn.score 

      - run: uv run --locked pytest
