name: CI

on: push

jobs:
  allt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - run: pip install -e .

      - run: python -m churn.model

      - run: python -m churn.evaluate 

      - run: python -m churn.score 

      - run: pytest
