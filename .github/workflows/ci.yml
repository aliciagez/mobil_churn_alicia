name: CI

on: push

jobs:
  tester:
    runs-on: ubuntu-latest
    
    strategy: 
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    
      steps:
        - uses: actions/checkout@v7

        - uses: astral-sh/setup-uv@v8.3.2
          with:
            python-version: ${{ matrix.python.version }}
            enable-cache: true

        - run: uv sync --locked

        - run: uv sync --locked pytest
      


      steps:
        - uses: actions/checkout@v7

        - uses: astral-sh/setup-uv@v8.3.2
          with:
          python-version: "3.11"
          enable-cache: true

        - run: uv sync --locked

        - run: uv run --locked python -m churn.model

        - run: uv run --locked python -m churn.evaluate 

        - run: uv run --locked python -m churn.score 

        - run: uv run --locked pytest
