name: CI

on: 
  push:
  workflow_dispatch:

jobs:
  tester:
    runs-on: ubuntu-latest
    
    strategy: 
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - run: uv sync --locked
      
      - run: uv run --locked python -m churn.model

      - run: uv run --locked python -m churn.evaluate 

      - run: uv run --locked python -m churn.score 

      - run: uv run --locked pytest
      

  traning:
    needs: tester
    runs-on: ubuntu-latest
      
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.11"
          enable-cache: true

      - run: uv sync --locked

      - run: uv run --locked python -m churn.model
      - name: model artifact
        uses: actions/upload-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/
 
  
  utvardera:
    needs: traning
    runs-on: ubuntu-latest
      
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.11"
          enable-cache: true
       
      - run: uv sync --locked

      - name: model artifact
        uses: actions/download-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - run: uv run --locked python -m churn.evaluate

      - name: summary
        if: ${{ always() }}
        run: | 
          echo "## UTVÄRDERING" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat outputs/matvarden.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY" 
              
